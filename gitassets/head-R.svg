<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 364" width="320" height="364" role="img" aria-label="Currently building VoltOS. 7 certifications, 3 active projects.">
  <style>
    .dot{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
    .ping{animation:ping 1.6s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);stroke-opacity:.65}100%{transform:scale(3.8);stroke-opacity:0}}
  </style>
  <defs>
    <clipPath id="panelClip"><rect x="0" y="0" width="880" height="364" rx="16"/></clipPath>
  </defs>
  <g transform="translate(-560,0)">
  <g clip-path="url(#panelClip)">
      <rect x="0" y="0" width="880" height="364" rx="16" fill="#0e0d0b"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.7" fill="#efeade">
        <text x="38" y="120">Mohammad</text>
        <text x="38" y="174">Yehya</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="40" y="44" width="18" height="1" fill="#EFBF04"/>
        <text x="68" y="48" font-size="11" letter-spacing="2.2" fill="#8a8274">GITHUB.COM/MOHAMMADYEHYA</text>
        <text x="40" y="208" font-size="12.5" fill="#a39b8a">System design · AI · developer tooling</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="644" y="34" width="196" height="30" rx="15" fill="#EFBF04" fill-opacity="0.05" stroke="#EFBF04" stroke-opacity="0.28"/>
        <circle class="dot" cx="662" cy="49" r="3.2" fill="#EFBF04"/>
        <g transform="translate(662,49)"><circle class="ping" r="3.2" fill="none" stroke="#EFBF04"/></g>
        <text x="674" y="53" font-size="10.5" fill="#dcd6c8">currently building VoltOS</text>
        <rect x="722" y="74" width="118" height="24" rx="4" fill="none" stroke="#312e26"/>
        <text x="734" y="90" font-size="10.5" fill="#99917f">7 certifications</text>
        <rect x="588" y="74" width="126" height="24" rx="4" fill="none" stroke="#312e26"/>
        <text x="600" y="90" font-size="10.5" fill="#99917f">3 active projects</text>
      </g>
      <rect x="40" y="240" width="800" height="1" fill="#EFBF04" fill-opacity="0.32"/>
      <text x="40" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#7d7568">A MILD OBSESSION</text>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#ddd7c8">
        <text x="40" y="310">I have a mild obsession with <tspan fill="#EFBF04">System Design</tspan> and <tspan fill="#EFBF04">AI</tspan>. If there's a new tech</text>
        <text x="40" y="338">out there, I'm probably already trying to break it or make it better.</text>
      </g>
      <rect x="1" y="1" width="878" height="362" rx="15" fill="none" stroke="#EFBF04" stroke-opacity="0.16"/>
  </g>
  </g>
</svg>
