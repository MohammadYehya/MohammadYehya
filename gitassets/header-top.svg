<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" role="img" aria-label="Mohammad Yehya — system design, AI, developer tooling. Currently building VoltOS. 7 certifications, 3 active projects.">
  <style>
    .grid{animation:drift 5s linear infinite}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(44px,44px)}}
    .shine{animation:shine 4s linear infinite}
    @keyframes shine{from{transform:translateX(-340px)}to{transform:translateX(600px)}}
    .dot{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
    .ping{animation:ping 1.6s ease-out infinite;transform-origin:662px 49px}
    @keyframes ping{0%{transform:scale(1);stroke-opacity:.65}100%{transform:scale(3.8);stroke-opacity:0}}
  </style>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#EFBF04" stroke-opacity="0.2" stroke-width="1"/>
    </pattern>
    <radialGradient id="veil" cx="18%" cy="10%" r="96%">
      <stop offset="0" stop-color="#0e0d0b" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0e0d0b" stop-opacity="0.7"/>
      <stop offset="0.92" stop-color="#0e0d0b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFBF04" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EFBF04" stop-opacity="1"/>
      <stop offset="1" stop-color="#EFBF04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD84A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD84A" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFD84A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameClip">
      <text x="38" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.7">Mohammad</text>
      <text x="38" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.7">Yehya</text>
    </clipPath>
  </defs>
  <path d="M14,0 H866 A14,14 0 0 1 880,14 V214 H0 V14 A14,14 0 0 1 14,0 Z" fill="#0e0d0b"/>
  <g class="grid"><rect x="10" y="10" width="900" height="260" fill="url(#grid)"/></g>
  <path d="M14,0 H866 A14,14 0 0 1 880,14 V214 H0 V14 A14,14 0 0 1 14,0 Z" fill="url(#veil)"/>
  <g clip-path="url(#nameClip)">
    <rect x="0" y="70" width="880" height="120" fill="#efeade"/>
    <rect class="shine" x="0" y="70" width="340" height="120" fill="url(#gold)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40" y="44" width="18" height="1" fill="#EFBF04"/>
    <text x="68" y="48" font-size="11" letter-spacing="2.2" fill="#8a8274">GITHUB.COM/MOHAMMADYEHYA</text>
    <text x="40" y="206" font-size="12.5" fill="#a39b8a">System design · AI · developer tooling</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="644" y="34" width="196" height="30" rx="15" fill="#EFBF04" fill-opacity="0.05" stroke="#EFBF04" stroke-opacity="0.28"/>
    <circle class="dot" cx="662" cy="49" r="3.2" fill="#EFBF04"/>
    <circle class="ping" cx="662" cy="49" r="3.2" fill="none" stroke="#EFBF04"/>
    <text x="674" y="53" font-size="10.5" fill="#dcd6c8">currently building VoltOS</text>
    <rect x="722" y="74" width="118" height="24" rx="4" fill="none" stroke="#312e26"/>
    <text x="734" y="90" font-size="10.5" fill="#99917f">7 certifications</text>
    <rect x="588" y="74" width="126" height="24" rx="4" fill="none" stroke="#312e26"/>
    <text x="600" y="90" font-size="10.5" fill="#99917f">3 active projects</text>
  </g>
  <path d="M1,214 V14 A13,13 0 0 1 14,1 H866 A13,13 0 0 1 879,14 V214" fill="none" stroke="#EFBF04" stroke-opacity="0.16"/>
</svg>
