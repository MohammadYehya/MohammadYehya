<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 364" width="390" height="364" role="img" aria-label="Mohammad Yehya — system design, AI, developer tooling. I have a mild obsession with System Design and AI. If there's a new tech out there, I'm probably already trying to break it or make it better.">
  <style>
    .grid{animation:drift 5s linear infinite}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(44px,44px)}}
    .shine{animation:shine 5s linear infinite}
    @keyframes shine{from{transform:translateX(-360px)}to{transform:translateX(880px)}}
  </style>
  <defs>
    <clipPath id="panelClip"><rect x="0" y="0" width="880" height="364" rx="16"/></clipPath>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#EFBF04" stroke-opacity="0.2" stroke-width="1"/>
    </pattern>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="0.74" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="vfade"><rect x="0" y="0" width="385" height="236" fill="url(#vgrad)"/></mask>
    <radialGradient id="veil" gradientUnits="userSpaceOnUse" cx="100" cy="30" r="300">
      <stop offset="0" stop-color="#0e0d0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0e0d0b" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#0e0d0b" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0e0d0b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD84A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD84A" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFD84A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameClip">
      <text x="38" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.7">Mohammad</text>
      <text x="38" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.7">Yehya</text>
    </clipPath>
  </defs>
  <g transform="translate(0,0)">
  <g clip-path="url(#panelClip)">
      <rect x="0" y="0" width="880" height="364" rx="16" fill="#0e0d0b"/>
      <g mask="url(#vfade)"><g class="grid"><rect x="-50" y="-50" width="435" height="290" fill="url(#grid)"/></g></g>
      <rect x="0" y="0" width="880" height="364" fill="url(#veil)"/>
      <g clip-path="url(#nameClip)">
        <rect x="0" y="70" width="880" height="120" fill="#efeade"/>
        <rect class="shine" x="0" y="70" width="360" height="120" fill="url(#gold)"/>
      </g>
      <circle cx="421" cy="94" r="18" fill="#EFBF04" fill-opacity="0.05" stroke="#EFBF04" stroke-opacity="0.3"/>
      <text x="421" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#EFBF04">in</text>
      <circle cx="421" cy="138" r="18" fill="#EFBF04" fill-opacity="0.05" stroke="#EFBF04" stroke-opacity="0.3"/>
      <text x="421" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#EFBF04">↗</text>
      <circle cx="421" cy="182" r="18" fill="#EFBF04" fill-opacity="0.05" stroke="#EFBF04" stroke-opacity="0.3"/>
      <text x="421" y="187" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#EFBF04">@</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="40" y="44" width="18" height="1" fill="#EFBF04"/>
        <text x="68" y="48" font-size="11" letter-spacing="2.2" fill="#8a8274">GITHUB.COM/MOHAMMADYEHYA</text>
        <text x="40" y="208" font-size="12.5" fill="#a39b8a">System design · AI · developer tooling</text>
      </g>
      <rect x="40" y="240" width="800" height="1" fill="#EFBF04" fill-opacity="0.32"/>
      <text x="40" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#7d7568">A MILD OBSESSION</text>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#ddd7c8">
        <text x="40" y="310">I have a mild obsession with <tspan fill="#EFBF04">System Design</tspan> and <tspan fill="#EFBF04">AI</tspan>. If there's a new tech</text>
        <text x="40" y="338">out there, I'm probably already trying to break it or make it better.</text>
      </g>
      <rect x="1" y="1" width="878" height="362" rx="15" fill="none" stroke="#EFBF04" stroke-opacity="0.16"/>
  </g>
  </g>
</svg>
