name: Build Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'main.tex'
      - 'other/certs/**'

  pull_request:
    branches:
      - main
    paths:
      - 'main.tex'
      - 'other/certs/**'

# Prevent multiple outdated builds from running simultaneously.
concurrency:
  group: resume-pdf-${{ github.ref }}
  cancel-in-progress: true

# Default to least-privilege permissions.
permissions:
  contents: read

jobs:
  build:
    name: Build Resume PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: "-pdf -interaction=nonstopmode -shell-escape"
          extra_system_packages: "inkscape librsvg"

      - name: Verify generated PDF
        run: |
          test -f main.pdf
          test -s main.pdf
          echo "PDF generated successfully"
          ls -lh main.pdf

      # Store the exact artifact produced by CI.
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: main.pdf
          retention-days: 7

  release:
    name: Release Latest Resume
    needs: build

    # Release only after changes are actually pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Only this job needs write access.
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Release Latest PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume Build
          files: main.pdf
          draft: false
          prerelease: false
          body: |
            Automated build of Mohammad Yehya Hayati's Resume.
            Generated on ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
